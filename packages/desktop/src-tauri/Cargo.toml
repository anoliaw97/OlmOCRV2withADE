[package]
name = "ocrllmvlmmlpetroafro-desktop"
version = "0.1.0"
description = "OpenCode-inspired desktop shell for OCR/LLM workflows"
edition = "2021"

[lib]
name = "ocrllmvlmmlpetroafro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
