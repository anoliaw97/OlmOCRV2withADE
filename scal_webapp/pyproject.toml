[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scal-webapp-offline"
version = "0.1.0"
description = "Offline SCAL extraction and JSON-only RAG web application"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Internal SCAL Team"}
]
dependencies = [
  "fastapi==0.116.1",
  "uvicorn==0.35.0",
  "jinja2==3.1.6",
  "python-multipart==0.0.20",
  "sqlalchemy==2.0.43",
  "pydantic==2.11.7",
  "pandas==2.3.2",
  "openpyxl==3.1.5",
  "python-docx==1.2.0",
  "pypdf==6.0.0",
  "scikit-learn==1.7.1",
  "joblib==1.5.1",
  "transformers==4.57.3",
  "accelerate==1.10.1",
  "huggingface-hub>=0.34.0,<1.0",
  "langchain>=0.3,<0.4",
  "langchain-core>=0.3,<0.4"
]

[project.scripts]
scal-webapp = "scal_webapp.launch_webapp:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = [".."]
include = ["scal_webapp*"]

[tool.setuptools.package-data]
scal_webapp = [
  "backend/templates/*.html",
  "backend/static/*.css",
  "backend/static/*.js"
]
